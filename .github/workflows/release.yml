name: Release skills
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s skills/coursework-word/scripts -p "test_*.py" -v
      - run: python skills/coursework-word/scripts/validate_docx.py skills/coursework-word/assets/coursework-template.docx --full --allow-placeholders
      - run: python -B -m unittest discover -s skills/coursework-diagrams/scripts -p "test_*.py" -v
      - run: python skills/coursework-diagrams/scripts/validate_drawio.py skills/coursework-diagrams/assets/bpmn-example.drawio --monochrome --kind 1=bpmn --kind 2=bpmn --kind 3=bpmn --kind 4=bpmn --kind 5=bpmn
      - run: python skills/coursework-diagrams/scripts/validate_drawio.py skills/coursework-diagrams/assets/repair-requests.drawio --monochrome --kind 1=idef-context --kind 2=idef-decomp --kind 3=dfd-gane-sarson --kind 4=dfd-gane-sarson --kind 5=dfd-gane-sarson --kind 6=sequence --kind 7=use-case --balance 1:2 --dfd-levels 3,4,5
      - run: python scripts/skills.py validate
      - run: python scripts/skills.py build
      - run: git diff --exit-code -- catalog.json
      - name: Publish versioned archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py
